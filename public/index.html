<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Помічник вчителя</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#070C1A;
  --panel:#0E1D3F;
  --card:#0D1B3A;
  --line:rgba(88,164,255,0.22);
  --blue-bright:#5AC8FF;
  --yellow:#FFC629;
  --ink:#EAF2FF;
  --muted:#7E93BE;
  --danger:#FF5D6C;
  --danger-bg:rgba(255,93,108,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Manrope',sans-serif;
  color:var(--ink);
  background:var(--bg);
  background-image:
    linear-gradient(rgba(88,164,255,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,164,255,.08) 1px, transparent 1px);
  background-size:38px 38px;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
}
.gate{
  width:100%; max-width:380px;
  background:linear-gradient(180deg, var(--card), var(--panel));
  border:1px solid var(--line);
  border-radius:12px;
  padding:32px 28px;
  box-shadow:0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.45);
  position:relative;
}
.gate::before, .gate::after{
  content:''; position:absolute; width:12px; height:12px;
  border-top:1.5px solid var(--blue-bright); border-left:1.5px solid var(--blue-bright);
  top:-1px; left:-1px; opacity:.7;
}
.gate::after{
  left:auto; right:-1px; top:auto; bottom:-1px;
  border-top:none; border-left:none;
  border-bottom:1.5px solid var(--blue-bright); border-right:1.5px solid var(--blue-bright);
}
h1{
  font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:19px; margin:0 0 6px;
  background:linear-gradient(90deg, var(--blue-bright), var(--yellow));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
p.sub{ color:var(--muted); font-size:13px; margin:0 0 24px; line-height:1.5; }
label{
  display:block; font-size:11px; font-weight:700; color:var(--muted);
  letter-spacing:.05em; text-transform:uppercase; font-family:'JetBrains Mono',monospace;
  margin-bottom:7px;
}
input[type=text]{
  width:100%; border:1.5px solid var(--line); background:rgba(6,12,28,.65);
  border-radius:7px; padding:12px 13px; font-size:14px; color:var(--ink);
  font-family:'JetBrains Mono',monospace; letter-spacing:.03em;
}
input[type=text]:focus{ outline:none; border-color:var(--blue-bright); box-shadow:0 0 0 3px rgba(90,200,255,.15); }
input[type=text]::placeholder{ color:#4a5a7d; }
button{
  width:100%; margin-top:16px; border:none; border-radius:7px; padding:13px;
  font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  background:var(--yellow); color:#101625; transition:filter .15s, transform .1s;
}
button:hover{ filter:brightness(1.08); }
button:active{ transform:translateY(1px); }
button:disabled{ opacity:.6; cursor:default; }
.error{
  display:none; margin-top:14px; padding:10px 12px; border-radius:7px;
  background:var(--danger-bg); color:var(--danger); font-size:12.5px; line-height:1.5;
}
.error.show{ display:block; }
.status{
  display:none; align-items:center; gap:10px; color:var(--muted); font-size:13px;
}
.status.show{ display:flex; }
.spinner{
  width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(90,200,255,.25); border-top-color:var(--blue-bright);
  animation:spin .7s linear infinite; flex-shrink:0;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
form.hidden{ display:none; }
</style>
</head>
<body>

<div class="gate">
  <h1>Помічник вчителя</h1>
  <p class="sub" id="subText">Введіть ліцензійний ключ, щоб відкрити застосунок.</p>

  <div class="status" id="statusBox">
    <span class="spinner"></span>
    <span id="statusText">Перевіряємо ліцензію…</span>
  </div>

  <form id="gateForm">
    <label for="keyInput">Ліцензійний ключ</label>
    <input type="text" id="keyInput" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button type="submit" id="submitBtn">Активувати</button>
    <div class="error" id="errorBox"></div>
  </form>
</div>

<script>
const STORAGE_KEY = 'teacherPlanner_licenseKey';

const form = document.getElementById('gateForm');
const input = document.getElementById('keyInput');
const submitBtn = document.getElementById('submitBtn');
const errorBox = document.getElementById('errorBox');
const statusBox = document.getElementById('statusBox');
const statusText = document.getElementById('statusText');
const subText = document.getElementById('subText');

const ERROR_MESSAGES = {
  not_found: 'Такого ключа не знайдено. Перевірте, чи правильно він введений.',
  banned: 'Цей ключ заблоковано.',
  disabled: 'Цей ключ вимкнено.',
  expired: 'Термін дії цього ключа закінчився.',
  max_uses_reached: 'Ліміт використань цього ключа вичерпано.',
  missing_key: 'Введіть ключ.',
};
function errorMessage(reason){
  return ERROR_MESSAGES[reason] || 'Не вдалося перевірити ключ. Спробуйте ще раз пізніше.';
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}
function hideError(){
  errorBox.classList.remove('show');
}
function showStatus(msg){
  form.classList.add('hidden');
  statusText.textContent = msg;
  statusBox.classList.add('show');
}
function showForm(){
  statusBox.classList.remove('show');
  form.classList.remove('hidden');
}

// Заміняє поточний документ повністю на отриманий HTML застосунку.
function loadApp(html){
  document.open();
  document.write(html);
  document.close();
}

async function requestApp(key, consumeUse){
  const res = await fetch('/api/app-content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, consumeUse }),
  });
  if(res.ok){
    const html = await res.text();
    return { ok: true, html };
  }
  let reason = 'unknown';
  try{ const body = await res.json(); reason = body.error || reason; }catch{}
  return { ok: false, reason };
}

async function tryAutoLogin(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(!saved){ showForm(); return; }

  showStatus('Перевіряємо ліцензію…');
  try{
    const result = await requestApp(saved, false);
    if(result.ok){
      loadApp(result.html);
      return;
    }
    localStorage.removeItem(STORAGE_KEY);
    subText.textContent = 'Потрібно ввести ключ ще раз.';
    showError(errorMessage(result.reason));
    showForm();
  }catch(e){
    subText.textContent = 'Не вдалося зв\'язатися із сервером. Перевірте інтернет-з\'єднання.';
    showForm();
  }
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  hideError();
  const key = input.value.trim();
  if(!key){ showError(errorMessage('missing_key')); return; }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Перевіряємо…';
  try{
    const result = await requestApp(key, true);
    if(result.ok){
      localStorage.setItem(STORAGE_KEY, key);
      loadApp(result.html);
      return;
    }
    showError(errorMessage(result.reason));
  }catch(e){
    showError('Не вдалося зв\'язатися із сервером. Перевірте інтернет-з\'єднання.');
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Активувати';
  }
});

tryAutoLogin();
</script>
</body>
</html>
